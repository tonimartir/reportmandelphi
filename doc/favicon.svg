<?xml version="1.0" encoding="UTF-8"?>
<!-- Reportman AI: el logo de la empresa, recortado para que se lea a 16 pixeles.

     ESTO NO ES UN VECTOR, y conviene saberlo antes de tocarlo: del logo solo existe el PNG
     (ReportmanFiscal/WebSite/images/Logo256.png, 256x256), asi que aqui va incrustado.

     DEL LOGO COMPLETO SE HAN QUITADO TRES COSAS a proposito: la chapa «AI», las ondas de abajo
     y el margen sobrante. A 16 px esos elementos no se leen, solo ensucian: la chapa se comia
     un quinto del icono y lo que quedaba era una mancha. Queda cerebro + barras verdes, que es
     lo unico que sobrevive a ese tamano, y encima es lo que mejor dice de que va esto.

     El cuadrado blanco redondeado NO es decoracion: sin fondo propio el icono desaparece en las
     pestanas de tema oscuro, que es justo lo que le pasaba al monograma al que sustituye. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <image href="data:image/png;base64," width="128" height="128"/>
</svg>
