<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Reportman</title>
  <!-- noindex, and it has to be HERE and not in robots.txt: this stub returns 200, so the only way
       Google drops it is to crawl it and read this. A Disallow would freeze it in the index. -->
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://reportman.es">
  <link rel="canonical" href="https://reportman.es">
  <script>
    window.location.replace("https://reportman.es");
  </script>
</head>
<body>
  <p>
    Redirecting to <a href="https://reportman.es">https://reportman.es</a>
  </p>
</body>
</html>
