; The sample reports of Report Manager, in the order the welcome dialog of the
; designers lists them. One section per report file; Title and Description
; in English, Title.<language> and Description.<language> translations (es,
; ca, de, fr, it, pt...), Thumbnail, the picture of its first page, and
; Prompt, a request in English that changes the dataset and the report,
; checked with the AI (the welcome window writes it in the copilot).
; UTF-8.

[fishes.rep]
Title=Fishes (classic)
Title.es=Peces (clásico)
Description=The classic Report Manager sample: groups by category, long notes that flow across pages, pictures stored in the database and a chart.
Description.es=El ejemplo clásico de Report Manager: grupos por categoría, notas largas que continúan en la página siguiente, imágenes guardadas en la base de datos y un gráfico.
Thumbnail=thumbnails/fishes.png
Prompt=In the dataset FISH order the fishes of each category by length, longest first, and print the species name under the common name

[customers.rep]
Title=Customers by country
Title.es=Clientes por país
Description=A list grouped by country, with the column headings repeated on every page, a count per group and the grand total.
Description.es=Un listado agrupado por país, con las cabeceras de columna repetidas en cada página, un recuento por grupo y el total general.
Thumbnail=thumbnails/customers.png
Prompt=Add the email of each customer to the dataset CUST and show it in the report as a new column after the phone

[invoices.rep]
Title=Invoices
Title.es=Facturas
Description=One invoice per page: customer, order lines, discounts, VAT and totals. It asks for the range of orders to print.
Description.es=Una factura por página: cliente, líneas del pedido, descuentos, IVA y totales. Pide el rango de pedidos a imprimir.
Thumbnail=thumbnails/invoices.png
Prompt=Add the EAN-13 code of each product to the dataset INV and print it in the order lines after the SKU

[letter.rep]
Title=Customer letter (HTML text)
Title.es=Carta a clientes (texto HTML)
Description=A personalised letter for each customer: text with HTML marks (bold, italics, underline, colours and another font) in paragraphs that grow with their text.
Description.es=Una carta personalizada para cada cliente: texto con marcas HTML (negrita, cursiva, subrayado, colores y otra fuente) en párrafos que crecen con su texto.
Thumbnail=thumbnails/letter.png
Prompt=Add the phone of each customer to the dataset LET and print it under the address of the letter

[sales-by-category.rep]
Title=Sales by category
Title.es=Ventas por categoría
Description=The sales of a year grouped by category with subtotals, and a summary with a bar chart from a second dataset.
Description.es=Las ventas de un año agrupadas por categoría con subtotales, y un resumen con gráfico de barras sobre un segundo conjunto de datos.
Thumbnail=thumbnails/sales-by-category.png
Prompt=Add the number of orders of each product to the dataset PROD as ORDER_COUNT and show it as a new column after the units

[product-catalog.rep]
Title=Product catalogue
Title.es=Catálogo de productos
Description=Products with EAN-13 barcodes; the stock below the reorder level is highlighted with conditional printing.
Description.es=Productos con códigos de barras EAN-13; el stock por debajo del mínimo se resalta con impresión condicional.
Thumbnail=thumbnails/product-catalog.png
Prompt=Add the stock value of each product (units in stock by unit price) to the dataset CAT as STOCK_VALUE and print it as a new column after the stock

[monthly-sales.rep]
Title=Monthly sales
Title.es=Ventas mensuales
Description=Orders and sales by month between two dates given as parameters, with totals, averages and a column chart.
Description.es=Pedidos y ventas por mes entre dos fechas que se piden como parámetros, con totales, medias y un gráfico de columnas.
Thumbnail=thumbnails/monthly-sales.png
Prompt=Add the number of different customers of each month to the dataset MON as CUSTOMERS and show it as a new column after the orders

[labels.rep]
Title=Address labels
Title.es=Etiquetas de direcciones
Description=Customer address labels, three per row on A4 sheets (70 x 36 mm), with the horizontal displacement of the detail section.
Description.es=Etiquetas con la dirección de los clientes, tres por fila en hojas A4 (70 x 36 mm), con el desplazamiento horizontal de la sección de detalle.
Thumbnail=thumbnails/labels.png
Prompt=Add the customer code to the dataset ADDR as CUSTOMER_CODE and print it in small type in the top right corner of each label

[international.rep]
Title=International text
Title.es=Texto internacional
Description=The same message in nine languages and eight scripts: Arabic and Hebrew from right to left, Devanagari, Thai and Japanese, with the fonts embedded in the PDF.
Description.es=El mismo mensaje en nueve idiomas y ocho escrituras: árabe y hebreo de derecha a izquierda, devanagari, tailandés y japonés, con las fuentes incrustadas en el PDF.
Thumbnail=thumbnails/international.png
Prompt=Add the greeting number GREETING_ID to the columns of the dataset G and print it before the language name
