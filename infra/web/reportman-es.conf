# =============================================================================
# reportman.es — LA WEB DEL PROYECTO, SERVIDA DESDE LA VM.
# =============================================================================
# Va MONTADO en el contenedor de nginx como /etc/nginx/conf.d/default.conf (ver
# docker-compose.yml al lado). No se instala nada: este fichero, el del repositorio, ES la
# configuracion que corre. Tras editarlo:
#
#     docker exec web-reportman-es nginx -t && docker exec web-reportman-es nginx -s reload
#
# DE DONDE VIENE. Hasta el 30-09-2026 esta web vivia en otro host (91.134.113.42), con un nginx
# ajeno y un despliegue por scp y unzip a mano --lo cuenta doc/dev/upload.txt, que todavia habla
# de SourceForge y de telnet--. Lo que se servia iba por detras del repositorio: la version del
# 20-06-2026 anunciaba la 4.0.10 cuando el repositorio ya iba por la 4.0.16 y con Lazarus.
#
# EL TLS NO ESTA AQUI. El anfitrion Windows de esta VM es la IP publica: su IIS termina el
# certificado de win-acme y reescribe a http://192.168.100.2:5083, igual que con ai.reportman.es
# (:5081) y erpaisoftware.com (:5082). Por el conmutador privado solo viaja HTTP.
#
# CUIDADO CON EL CORREO: mail.reportman.es vive en el host VIEJO y es por donde entra
# info@reportman.es, que es el contacto legal declarado. Mover el A de reportman.es NO lo toca
# --mail tiene su propio registro-- pero el dia que ese host se apague, el buzon se va con el.
server {
    listen 5083;
    server_name reportman.es www.reportman.es;

    # `actual` es un ENLACE RELATIVO al release en curso (releases/<sello>): relativo a proposito,
    # porque un enlace absoluto a /home/toni/... no se resolveria DENTRO del contenedor, donde el
    # sitio se monta en /srv/sitio. nginx lo resuelve en cada peticion, asi que repuntarlo publica
    # sin recargar ni reiniciar nada.
    root /srv/sitio/actual;
    index index.html;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    # QUIEN VISITA, NO QUIEN HACE DE PROXY: la IP real la trae ARR en X-Forwarded-For.
    set_real_ip_from 192.168.100.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Un redirect de nginx detras de un proxy mandaria al visitante a http://192.168.100.2:5083/…
    # Con esto el Location sale relativo. Y aqui importa mas que en las otras dos: esta web tiene
    # carpetas de verdad (/doc/, /docnet/, /doc/tutorial/) y nginx redirige /doc -> /doc/.
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;

    # LO MISMO QUE MANDA EL HOST VIEJO, comprobado el 30-09-2026 contra https://reportman.es/:
    # `cache-control: no-cache`, tambien en el CSS. Los nombres de fichero no llevan hash, asi que
    # una cache larga retrasaria cada correccion; y el sitio son paginas y PDF que se revalidan con
    # un 304 de nada.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;

    # La imagen de nginx no conoce .webmanifest (su mime.types no lo trae) y lo serviria como
    # application/octet-stream. Se arregla en el sitio exacto en vez de redefinir la tabla entera
    # con un bloque `types`, que SUSTITUYE la heredada y se lleva por delante todo lo demas.
    location = /site.webmanifest { default_type application/manifest+json; }

    # El sitio es estatico y sus rutas son ficheros y carpetas de verdad: lo que no existe es un
    # 404 de verdad. Ni SPA ni reescrituras, que esta web no las tiene.
    location / {
        try_files $uri $uri/ =404;
    }
}
