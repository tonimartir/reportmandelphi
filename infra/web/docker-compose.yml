# =============================================================================
# reportman.es — el nginx que la sirve, en un contenedor.
# =============================================================================
# EN UN CONTENEDOR PARA QUE PUBLICAR NO PIDA ROOT. Un nginx de paquete obliga a `apt-get install`,
# a escribir en /etc/nginx y a una carpeta en /opt: tres cosas de root. Con Docker --que ya sirve
# reportman-web en el :8080-- el despliegue es de quien despliega y no pide ninguna contrasena.
#
#     docker compose -f infra/web/docker-compose.yml up -d
#
# LA CONFIGURACION NO SE INSTALA, SE MONTA: el .conf de al lado, el del repositorio, es el que
# corre. Se edita y se recarga con `docker exec web-reportman-es nginx -s reload`.
name: web-reportman-es

services:
  web:
    image: nginx:1.29-alpine
    container_name: web-reportman-es
    restart: unless-stopped

    # ATADO A LA IP DEL CONMUTADOR PRIVADO, Y AHI ESTA TODO EL CORTAFUEGOS: 192.168.100.2 solo lo
    # alcanza el anfitrion Windows, que es quien hace de proxy inverso. Sin esa IP delante, Docker
    # lo publicaria en TODAS las interfaces y --esto es lo que se paga por usar Docker-- una regla
    # de ufw no lo taparia: los puertos publicados se abren en iptables por delante de ufw.
    ports:
      - "192.168.100.2:5083:5083"

    volumes:
      # Sustituye al vhost de ejemplo de la imagen. :ro porque nginx solo tiene que leerlo.
      - ./reportman-es.conf:/etc/nginx/conf.d/default.conf:ro
      # EL SITIO ENTERO, no solo `actual`: el enlace apunta a releases/<sello>, que tiene que
      # existir tambien dentro del contenedor para que se resuelva. Y :ro --nginx sirve, no
      # escribe--, que ademas deja al contenedor sin forma de tocar lo publicado.
      - ${WEB_RAIZ:-/home/toni/webs/reportman-es}:/srv/sitio:ro

    # EL SISTEMA DE FICHEROS DEL CONTENEDOR, DE SOLO LECTURA, con lo justo escribible: es el
    # equivalente del ProtectSystem=strict de reportmanfiscal.service. nginx necesita su cache,
    # su pid y /tmp, y nada mas.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5083/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    # El registro de accesos va al stdout del contenedor; sin limite crece hasta llenar el disco.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
