; The connections of sales_sqldb.rep and sales_zeos.rep to the sample
; database of createdb.sh. pgreport reads this file; the designer reads the
; connections file of the user: copy both sections there to open the
; reports in the designer. On macOS and Linux it is ~/.dbxconnections, or
; ~/.borland/dbxconnections when ~/.borland/dbxdrivers exists (the Linux
; packages create it).
;
; The client library (libpq) is found in the usual places: Homebrew,
; Postgres.app, the EnterpriseDB installer and the system. Another one:
; VendorLib=/path/to/libpq.5.dylib (SQLdb) and
; LibraryLocation=/path/to/libpq.5.dylib (Zeos).

[RPSAMPLE_SQLDB]
DriverName=FireDac
DriverID=PG
Server=localhost
Port=5432
Database=rpsample
User_Name=rpsample
Password=rpsample
CharacterSet=UTF8

[RPSAMPLE_ZEOS]
Database Protocol=postgresql
HostName=localhost
Port=5432
Database=rpsample
User_Name=rpsample
Password=rpsample
Property1=codepage=UTF8
